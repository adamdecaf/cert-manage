name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build release binaries
        run: |
          set -euo pipefail
          mkdir -p dist

          build() {
            local goos="$1" goarch="$2" out="$3"
            echo "building dist/${out}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath -o "dist/${out}" .
          }

          # Primary trustprune assets.
          build linux amd64 trustprune-linux-amd64
          build linux arm64 trustprune-linux-arm64
          build darwin amd64 trustprune-osx-amd64
          build darwin arm64 trustprune-osx-arm64
          build windows amd64 trustprune-amd64.exe
          build windows arm64 trustprune-arm64.exe

          # cert-manage remains a same-binary alias through 0.2.x.
          cp dist/trustprune-linux-amd64 dist/cert-manage-linux-amd64
          cp dist/trustprune-linux-arm64 dist/cert-manage-linux-arm64
          cp dist/trustprune-osx-amd64 dist/cert-manage-osx-amd64
          cp dist/trustprune-osx-arm64 dist/cert-manage-osx-arm64
          cp dist/trustprune-amd64.exe dist/cert-manage-amd64.exe
          cp dist/trustprune-arm64.exe dist/cert-manage-arm64.exe
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
