version: 2

project_name: cert-manage

builds:
  - id: cert-manage
    main: .
    binary: cert-manage
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath

archives:
  - formats: [binary]
    name_template: >-
      {{- if eq .Os "linux" -}}
      cert-manage-linux-{{ .Arch }}
      {{- else if eq .Os "darwin" -}}
      cert-manage-osx-{{ .Arch }}
      {{- else if eq .Os "windows" -}}
      cert-manage-{{ .Arch }}
      {{- else -}}
      cert-manage-{{ .Os }}-{{ .Arch }}
      {{- end -}}

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Docs
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - '^test:'
      - '^chore:'
      - '^Merge '
      - 'Merge pull request'
      - 'Merge branch'

release:
  draft: false
  prerelease: auto
